services:
  postgres:
    image: postgres:16-alpine
    container_name: jt-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-root}
      POSTGRES_DB: ${POSTGRES_DB:-db_ikag}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-db_ikag}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ikag-network

  redis:
    image: redis:7-alpine
    container_name: jt-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks:
      - ikag-network

  jaeger:
    image: jaegertracing/jaeger:2.23.0
    container_name: jt-jaeger
    restart: unless-stopped
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
      - "${JAEGER_OTLP_HTTP_PORT:-4318}:4318"
      - "${JAEGER_OTLP_GRPC_PORT:-4317}:4317"
    networks:
      - ikag-network

  actionlint:
    image: rhysd/actionlint:latest
    container_name: jt-actionlint
    profiles: ["lint"]
    volumes:
      - .:/repo:ro
    working_dir: /repo
    command: ["-color", "-verbose"]

volumes:
  postgres_data:
  redis_data:

networks:
  ikag-network:
    driver: bridge
